<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 50" width="100%" height="100%">
  <style>
    .brand-text {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 46px;
      font-weight: bold;
      letter-spacing: -1.5px;
      fill: #14532D;
      transition: fill 0.3s ease;
    }
    .leaf-primary {
      fill: #10B981;
    }
    .leaf-secondary {
      fill: #F59E0B;
    }
    @media (prefers-color-scheme: dark) {
      .brand-text {
        fill: #FFFFFF;
      }
    }
  </style>
  
  <!-- Text -->
  <text x="5" y="42" class="brand-text">Eden</text>
  
  <!-- Main Leaf -->
  <path d="M 85 24 Q 78 5 98 0 Q 110 5 95 24 Q 90 26 85 24 Z" class="leaf-primary" />
  
  <!-- Smaller Leaf -->
  <path d="M 86 24 Q 78 12 85 6 Q 95 6 92 14 Q 90 20 86 24 Z" class="leaf-secondary" />
</svg>
